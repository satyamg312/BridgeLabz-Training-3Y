<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Combined CSS Effects</h1>
        <p>Hover over the elements to see the effects</p>
    </header>

    <main>
        <section class="effects">

            <div class="effect-card">
                <h2>Button Effect</h2>
                <button class="btn">Hover Me</button>
            </div>

            <div class="effect-card">
                <h2>Card Effect</h2>
                <div class="card">Hover Me</div>
            </div>

            <div class="effect-card">
                <h2>Link Effect</h2>
                <a href="#" class="link">Hover Link</a>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Combined Effects</p>
    </footer>

</body>
</html>
