<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Image Showcase</h1>
        <p>Hover over an image to see the effect</p>
    </header>

    <main>
        <section class="gallery">

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1015/500/350" alt="Mountain">
                    <div class="overlay">Explore Nature</div>
                </div>
                <figcaption>Beautiful Mountain</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1016/500/350" alt="Forest">
                    <div class="overlay">Green Forest</div>
                </div>
                <figcaption>Peaceful Forest</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1018/500/350" alt="River">
                    <div class="overlay">Discover</div>
                </div>
                <figcaption>Mountain River</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1025/500/350" alt="Dog">
                    <div class="overlay">Lovely Animal</div>
                </div>
                <figcaption>Happy Dog</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1035/500/350" alt="Lake">
                    <div class="overlay">Beautiful View</div>
                </div>
                <figcaption>Calm Lake</figcaption>
            </figure>

            <figure class="image-card">
                <div class="image-container">
                    <img src="https://picsum.photos/id/1043/500/350" alt="Beach">
                    <div class="overlay">Enjoy the Beach</div>
                </div>
                <figcaption>Sunny Beach</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Image Showcase</p>
    </footer>

</body>
</html>
