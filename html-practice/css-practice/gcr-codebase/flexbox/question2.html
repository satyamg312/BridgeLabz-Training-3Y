<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the elements to see the tooltips</p>
    </header>

    <main>
        <section class="tooltip-container">

            <!-- Tooltip 1 -->
            <div class="tooltip-box">
                <span class="tooltip-element">HTML</span>
                <span class="tooltip-text">HyperText Markup Language</span>
            </div>

            <!-- Tooltip 2 -->
            <div class="tooltip-box">
                <span class="tooltip-element">CSS</span>
                <span class="tooltip-text">Cascading Style Sheets</span>
            </div>

            <!-- Tooltip 3 -->
            <div class="tooltip-box">
                <span class="tooltip-element">Flexbox</span>
                <span class="tooltip-text">CSS layout system</span>
            </div>

            <!-- Tooltip 4 -->
            <div class="tooltip-box">
                <span class="tooltip-element">Grid</span>
                <span class="tooltip-text">Two-dimensional CSS layout</span>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tooltip Demo</p>
    </footer>

</body>
</html>
