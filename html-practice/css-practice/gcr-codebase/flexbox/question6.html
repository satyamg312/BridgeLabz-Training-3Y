<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>CSS Animation Demonstration</h1>
        <p>Animations created using CSS @keyframes</p>
    </header>

    <main>
        <section class="animation-container">

            <!-- Moving Box -->
            <div class="box">Moving Box</div>

            <!-- Bouncing Ball -->
            <div class="ball"></div>

            <!-- Color Changing Text -->
            <h2 class="animated-text">Color Changing Text</h2>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 CSS Animation Demo</p>
    </footer>

</body>
</html>
