<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            width:100vw;
        }
        .container{
            height: 100%;
            width: 100%;
            background-color: rgb(120, 120, 157);
            display: grid;
            padding: 4rem;
            row-gap: 1rem;
            column-gap: 1rem;
           /* grid-template-columns: 100px 100px  ;*/
            grid-template-rows: repeat(4, 1fr);
            /*grid-template-rows: 100px 100px 100px;*/ 
            grid-template-columns: repeat(3, 1fr);
        }
        .item{
            background-color: rgb(134, 16, 202);
            border: 5px solid rgb(240, 237, 237);
            display: flex;
            font-size: 30px;
            align-items: center;
            justify-content: center;
        }
        .header , .footer{
            grid-column-start: 1;
            grid-column-end: 4;
        }
        .sidebar{
            grid-row-start: 2;
            grid-row-end: 4;
        }
        .content{
            grid-column-start: 2;
            grid-column-end: 4;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item header">Header</div>
        <div class="item sidebar">Sidebar</div>
        <div class="item content">Content 1</div>
        <div class="item ">item 4</div>
        <div class="item">item 5</div>
        <div class="item footer">Footer</div>
    </div>
    
</body>
</html>
