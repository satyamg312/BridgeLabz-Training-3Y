<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>

    <!-- External CSS file -->
    <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>

<body>

    <header>
        <h1>Image Filter Gallery</h1>
        <p>Hover over an image to remove its filter.</p>
    </header>

    <main>
        <section class="gallery">

            <!-- Image 1 - Blur -->
            <figure class="gallery-item">
                <img class="blur" 
                     src="https://picsum.photos/id/1015/500/350" 
                     alt="Mountain landscape">
                <figcaption>Blur Filter</figcaption>
            </figure>

            <!-- Image 2 - Grayscale -->
            <figure class="gallery-item">
                <img class="grayscale" 
                     src="https://picsum.photos/id/1016/500/350" 
                     alt="Nature landscape">
                <figcaption>Grayscale Filter</figcaption>
            </figure>

            <!-- Image 3 - Sepia -->
            <figure class="gallery-item">
                <img class="sepia" 
                     src="https://picsum.photos/id/1025/500/350" 
                     alt="Dog">
                <figcaption>Sepia Filter</figcaption>
            </figure>

            <!-- Image 4 - Brightness -->
            <figure class="gallery-item">
                <img class="brightness" 
                     src="https://picsum.photos/id/1035/500/350" 
                     alt="River and mountains">
                <figcaption>Brightness Filter</figcaption>
            </figure>

            <!-- Image 5 - Contrast -->
            <figure class="gallery-item">
                <img class="contrast" 
                     src="https://picsum.photos/id/1043/500/350" 
                     alt="Forest">
                <figcaption>Contrast Filter</figcaption>
            </figure>

            <!-- Image 6 - Hue Rotate -->
            <figure class="gallery-item">
                <img class="hue-rotate" 
                     src="https://picsum.photos/id/1050/500/350" 
                     alt="Mountain and lake">
                <figcaption>Hue-Rotate Filter</figcaption>
            </figure>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Image Filter Gallery</p>
    </footer>

</body>
</html>
